name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure pinned toolchain
        run: |
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "16.4"
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/xcresults"
          echo "MACOS_DESTINATION=platform=macOS,arch=$(uname -m)" >> "$GITHUB_ENV"

      - name: Validate project files
        run: |
          plutil -lint LittleWatch/Resources/Info.plist
          zsh -n scripts/build-release.sh

      - name: Run tests
        id: tests
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Debug \
            -destination "$MACOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchTests" \
            -resultBundlePath "$RUNNER_TEMP/xcresults/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Build Release configuration
        id: release_build
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchReleaseBuild" \
            -resultBundlePath "$RUNNER_TEMP/xcresults/ReleaseBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Run static analysis
        id: analyze
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Debug \
            -destination "$MACOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchAnalyze" \
            -resultBundlePath "$RUNNER_TEMP/xcresults/Analyze.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            analyze

      - name: Upload failure diagnostics
        if: ${{ !cancelled() && (steps.tests.outcome == 'failure' || steps.release_build.outcome == 'failure' || steps.analyze.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LittleWatch-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcresults
          if-no-files-found: warn
          retention-days: 7
