name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchTests" \
            CODE_SIGNING_ALLOWED=NO \
            test
