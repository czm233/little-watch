name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Release
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure pinned toolchain
        run: |
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "16.4"
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/xcresults"
          echo "MACOS_DESTINATION=platform=macOS,arch=$(uname -m)" >> "$GITHUB_ENV"

      - name: Validate version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本标签必须使用 vX.Y.Z 格式"
            exit 1
          fi

      - name: Run tests
        id: tests
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Debug \
            -destination "$MACOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchTests" \
            -resultBundlePath "$RUNNER_TEMP/xcresults/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Upload failed test result
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LittleWatch-release-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcresults/Tests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Build universal Release package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/release
          DERIVED_DATA_PATH: ${{ runner.temp }}/LittleWatchRelease
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/*.dmg \
            --verify-tag \
            --generate-notes \
            --title "Little Watch ${GITHUB_REF_NAME#v}"
