name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本标签必须使用 vX.Y.Z 格式"
            exit 1
          fi

      - name: Run tests
        run: |
          xcodebuild -quiet \
            -project LittleWatch.xcodeproj \
            -scheme LittleWatch \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/LittleWatchTests" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build universal Release package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/release
          DERIVED_DATA_PATH: ${{ runner.temp }}/LittleWatchRelease
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/*.zip \
            "$RUNNER_TEMP"/release/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Little Watch ${GITHUB_REF_NAME#v}"
